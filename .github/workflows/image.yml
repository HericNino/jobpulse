name: Image

# Builds the API image, starts it and checks the endpoints, then publishes it to
# GitHub Container Registry. Also runs after each data collection, so the image
# always carries the latest data. No API keys involved.
on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, pyproject.toml, uv.lock, "src/**", "transform/**", "data/postings.jsonl", .github/workflows/image.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, pyproject.toml, uv.lock, "src/**", "transform/**", .github/workflows/image.yml]
  workflow_run:
    workflows: ["Collect and publish"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          docker buildx build --load -t jobpulse-api:ci \
            --cache-from type=gha --cache-to type=gha,mode=max .
          docker image ls jobpulse-api:ci --format 'Image size: {{.Size}}'

      - name: Smoke test
        run: |
          docker run -d --name api --read-only --tmpfs /tmp -p 8000:8000 jobpulse-api:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' api)
            [ "$status" = healthy ] && break
            sleep 2
          done
          if [ "$status" != healthy ]; then docker logs api; exit 1; fi
          curl -fsS localhost:8000/health
          curl -fsS "localhost:8000/skills?limit=3" | python3 -c "import json,sys; assert len(json.load(sys.stdin)) == 3"
          curl -fsS localhost:8000/openapi.json > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/skills/not-a-skill)" = 404
          test "$(docker exec api id -u)" = 10001

      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest "sha-${GITHUB_SHA::7}" "$(date -u +%F)"; do
            docker tag jobpulse-api:ci "$image:$tag"
            docker push "$image:$tag"
          done
          echo "Published $image" >> "$GITHUB_STEP_SUMMARY"
